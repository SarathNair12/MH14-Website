<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mark-title">
  <title id="mark-title">MH14 Ventures mark</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#112520"/>
      <stop offset="100%" stop-color="#071815"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D6C29A" stop-opacity="0.68"/>
      <stop offset="55%" stop-color="#D6C29A" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#9A7840" stop-opacity="0.58"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="120" height="120" rx="30" fill="url(#bgGrad)"/>

  <!-- Main border ring -->
  <rect x="5" y="5" width="110" height="110" rx="25.5" stroke="url(#borderGrad)" stroke-width="1"/>

  <!-- Corner tick marks -->
  <path d="M12,24 L12,12 L24,12" stroke="#D6C29A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.52" fill="none"/>
  <path d="M96,12 L108,12 L108,24" stroke="#D6C29A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.52" fill="none"/>
  <path d="M12,96 L12,108 L24,108" stroke="#D6C29A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.52" fill="none"/>
  <path d="M96,108 L108,108 L108,96" stroke="#D6C29A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.52" fill="none"/>

  <!-- M letterform (ivory/white) -->
  <path d="M12,66 L12,22 L20,22 L34,46 L48,22 L56,22 L56,66 L48,66 L48,41 L34,58 L20,41 L20,66 Z" fill="#F5EDD8"/>

  <!-- H letterform (champagne/gold) -->
  <path d="M64,66 L64,22 L72,22 L72,42 L100,42 L100,22 L108,22 L108,66 L100,66 L100,50 L72,50 L72,66 Z" fill="#D6C29A"/>

  <!-- Gold divider -->
  <line x1="28" y1="78" x2="92" y2="78" stroke="#9A7840" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- "1" numeral -->
  <path d="M45,87 L49,83 L49,105" stroke="#D6C29A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.88" fill="none"/>
  <line x1="44" y1="105" x2="54" y2="105" stroke="#D6C29A" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.88"/>

  <!-- "4" numeral -->
  <path d="M64,82 L64,93 L73,93" stroke="#D6C29A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.88" fill="none"/>
  <line x1="73" y1="82" x2="73" y2="105" stroke="#D6C29A" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.88"/>
</svg>
